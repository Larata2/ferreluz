<!-- MODAL COMPRA -->
<div id="modalCompra" class="modal">

<div class="modal-contenido">

<h2>Formulario de Compra</h2>

<p id="productoSeleccionado"></p>

<input type="text" placeholder="Nombre completo">
<input type="email" placeholder="Correo electrónico">
<input type="text" placeholder="Número de tarjeta">
<input type="text" placeholder="Fecha vencimiento">
<input type="text" placeholder="CVV">

<br><br>

<button
onclick="finalizarCompra()"
style="
width:100%;
padding:15px;
background:#f97316;
color:white;
border:none;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;

PAGAR
</button>

</div>

<!-- JS -->
<script>

function abrirCompra(producto){
document.getElementById("modalCompra").style.display = "flex";
document.getElementById("productoSeleccionado").innerText = "Producto: " + producto;
}

function cerrarCompra(){
document.getElementById("modalCompra").style.display = "none";
}

function finalizarCompra(){
alert("Compra realizada correctamente");
cerrarCompra();
}

let productoActual = "";

function abrirCompra(producto){

productoActual = producto;

document.getElementById("modalCompra").style.display="flex";

document.getElementById("productoSeleccionado").innerHTML =
"Producto seleccionado: " + producto;

}

function cerrarCompra(){

document.getElementById("modalCompra").style.display="none";

}

function finalizarCompra(){

let carrito =
JSON.parse(localStorage.getItem("carrito")) || [];

carrito.push(productoActual);

localStorage.setItem(
"carrito",
JSON.stringify(carrito)
);

alert("Compra realizada correctamente");

cerrarCompra();

}

</script>
